<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 720" width="1480" height="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#16202b">
<title>Refinement strategy: 2^N fan-out versus weight-ordered binary splitting</title>
<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16202b"/>
  </marker>
  <style>
    .ttl{ font-size:19px; font-weight:700; letter-spacing:1.5px; }
    .sub { font-size:13.4px; fill:#5a6b7a; }
    .pn  { font-size:14.4px; font-weight:700; }
    .pl  { font-size:12.2px; fill:#3d4d5c; }
    .sm  { font-size:11.4px; fill:#5a6b7a; }
    .smb { font-size:11.4px; font-weight:700; }
    .tag { font-size:10.6px; font-weight:700; fill:#ffffff; }
    .mt  { font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .cap { font-family:Georgia,'Times New Roman',serif; font-size:13.2px; fill:#4b5b6a; }
    .ax  { stroke:#8a9aa8; stroke-width:1.1; fill:none; }
    .grid{ stroke:#e4eaef; stroke-width:1; fill:none; }
  </style>
</defs>
<rect width="1480" height="720" fill="#ffffff"/>

<text class="ttl" x="32" y="36">TWO WAYS TO REFINE A CELL — AND WHAT EACH COSTS AS N GROWS</text>
<text class="sub" x="32" y="58">The branch-and-bound proof is indifferent to how the boxes are made, so this is a change of data structure, not of mathematics</text>
<path d="M32 72 H1448" stroke="#16202b" stroke-width="1.6"/>

<!-- ============ panel (a) ============ -->
<rect x="32" y="90" width="454" height="470" rx="7" fill="#fffdf9" stroke="#e6d8bf"/>
<rect x="32" y="90" width="454" height="34" rx="7" fill="#b26a00"/>
<rect x="32" y="112" width="454" height="12" fill="#b26a00"/>
<text class="pn" x="48" y="113" fill="#ffffff">(a)  Current: 2ᴺ-tree — every child is created</text>

<!-- square: quadtree subdivision -->
<g>
  <rect x="72" y="146" width="200" height="200" fill="#fdf3e3" stroke="#b26a00" stroke-width="1.6"/>
  <path d="M172 146 V346 M72 246 H272" stroke="#b26a00" stroke-width="1.4"/>
  <rect x="72" y="146" width="100" height="100" fill="#f6e3c4"/>
  <path d="M122 146 V246 M72 196 H172" stroke="#b26a00" stroke-width="1"/>
  <rect x="72" y="146" width="200" height="200" fill="none" stroke="#b26a00" stroke-width="1.6"/>
  <text class="sm" x="172" y="366" text-anchor="middle">one split → 4 cells; then 4 more</text>
</g>
<!-- fan -->
<g>
  <circle cx="380" cy="166" r="9" fill="#b26a00"/>
  <g stroke="#d9a45c" stroke-width="1.2">
    <path d="M380 175 L306 232 M380 175 L327 232 M380 175 L348 232 M380 175 L369 232"/>
    <path d="M380 175 L391 232 M380 175 L412 232 M380 175 L433 232 M380 175 L454 232"/>
  </g>
  <g fill="#fdf3e3" stroke="#b26a00" stroke-width="1.3">
    <circle cx="306" cy="239" r="7"/><circle cx="327" cy="239" r="7"/><circle cx="348" cy="239" r="7"/><circle cx="369" cy="239" r="7"/>
    <circle cx="391" cy="239" r="7"/><circle cx="412" cy="239" r="7"/><circle cx="433" cy="239" r="7"/><circle cx="454" cy="239" r="7"/>
  </g>
  <text class="smb" x="380" y="264" text-anchor="middle">N = 3 → 8 children</text>
  <text class="sm" x="380" y="282" text-anchor="middle">one subdivision, all of them materialised</text>
</g>
<!-- cost callout -->
<rect x="296" y="300" width="174" height="46" rx="5" fill="#fbe4e2" stroke="#b3261e" stroke-width="1.1"/>
<text class="smb" x="383" y="320" text-anchor="middle" fill="#8f1d17">N = 10 → 1 024</text>
<text class="smb" x="383" y="337" text-anchor="middle" fill="#8f1d17">N = 20 → 1 048 576</text>

<text class="pl" x="48" y="382">Branching factor is 2ᴺ. The fan-out, not the proof, is</text>
<text class="pl" x="48" y="400">what makes the present implementation stop being</text>
<text class="pl" x="48" y="418">usable at around ten dimensions: a single subdivision</text>
<text class="pl" x="48" y="436">allocates every orthant, whether it is ever visited or not.</text>
<rect x="48" y="456" width="422" height="30" rx="4" fill="#f6e3c4"/>
<text class="smb" x="60" y="476" fill="#7a4600">Ceiling: N ≈ 10</text>
<text class="sm" x="176" y="476">— set by memory per split, not by accuracy</text>

<!-- ============ panel (b) ============ -->
<rect x="512" y="90" width="454" height="470" rx="7" fill="#f9fdfa" stroke="#c9e2d0"/>
<rect x="512" y="90" width="454" height="34" rx="7" fill="#2e7d32"/>
<rect x="512" y="112" width="454" height="12" fill="#2e7d32"/>
<text class="pn" x="528" y="113" fill="#ffffff">(b)  Proposed: weight-ordered k-d splits</text>

<!-- square: kd subdivision -->
<g>
  <rect x="552" y="146" width="200" height="200" fill="#eef8f0" stroke="#2e7d32" stroke-width="1.6"/>
  <path d="M652 146 V346" stroke="#2e7d32" stroke-width="1.6"/>
  <path d="M652 246 H752" stroke="#2e7d32" stroke-width="1.4"/>
  <path d="M702 246 V346" stroke="#2e7d32" stroke-width="1.2"/>
  <rect x="702" y="246" width="50" height="100" fill="#c9e8ce"/>
  <rect x="552" y="146" width="200" height="200" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
  <g class="tag">
    <circle cx="652" cy="158" r="8.5" fill="#2e7d32"/><text x="652" y="162" text-anchor="middle">1</text>
    <circle cx="740" cy="246" r="8.5" fill="#2e7d32"/><text x="740" y="250" text-anchor="middle">2</text>
    <circle cx="702" cy="334" r="8.5" fill="#2e7d32"/><text x="702" y="338" text-anchor="middle">3</text>
  </g>
  <text class="sm" x="602" y="250" text-anchor="middle">never split</text>
  <text class="sm" x="727" y="366" text-anchor="middle">visited leaf</text>
</g>
<!-- binary tree -->
<g>
  <circle cx="860" cy="166" r="9" fill="#2e7d32"/>
  <g stroke="#bcd9c1" stroke-width="1.4">
    <path d="M860 175 L820 205"/><path d="M860 175 L900 205"/>
    <path d="M820 214 L790 244"/><path d="M820 214 L850 244"/>
    <path d="M900 214 L870 244"/>
  </g>
  <path d="M860 175 L900 205" stroke="#2e7d32" stroke-width="2.4" fill="none"/>
  <path d="M900 214 L930 244" stroke="#2e7d32" stroke-width="2.4" fill="none"/>
  <g fill="#eef8f0" stroke="#2e7d32" stroke-width="1.3">
    <circle cx="820" cy="209" r="7"/><circle cx="790" cy="249" r="7"/><circle cx="850" cy="249" r="7"/><circle cx="870" cy="249" r="7"/>
  </g>
  <circle cx="900" cy="209" r="7.5" fill="#2e7d32"/>
  <circle cx="930" cy="249" r="7.5" fill="#2e7d32"/>
  <text class="smb" x="860" y="278" text-anchor="middle">any N → 2 children</text>
  <text class="sm" x="860" y="296" text-anchor="middle">only the path actually visited is allocated</text>
</g>
<rect x="776" y="310" width="174" height="46" rx="5" fill="#e3f2e4" stroke="#2e7d32" stroke-width="1.1"/>
<text class="smb" x="863" y="330" text-anchor="middle" fill="#1e5b21">N splits = one 2ᴺ level</text>
<text class="smb" x="863" y="347" text-anchor="middle" fill="#1e5b21">at identical resolution</text>

<text class="pl" x="528" y="382">Cut one axis at a time, cycling them by descending</text>
<text class="pl" x="528" y="400">weight γ. Resolution per unit of memory is unchanged,</text>
<text class="pl" x="528" y="418">but cost now tracks the <tspan font-style="italic">effective</tspan> dimension: axes that</text>
<text class="pl" x="528" y="436">carry little weight are simply never cut.</text>
<rect x="528" y="456" width="422" height="30" rx="4" fill="#d8ecdb"/>
<text class="smb" x="540" y="476" fill="#1e5b21">Ceiling: N ≈ 10²</text>
<text class="sm" x="660" y="476">— and no proof is touched</text>

<!-- ============ panel (c) ============ -->
<rect x="992" y="90" width="456" height="470" rx="7" fill="#ffffff" stroke="#d5dee6"/>
<rect x="992" y="90" width="456" height="34" rx="7" fill="#0d1721"/>
<rect x="992" y="112" width="456" height="12" fill="#0d1721"/>
<text class="pn" x="1008" y="113" fill="#ffffff">(c)  Children allocated per subdivision</text>

<rect x="1062" y="152" width="354" height="216" fill="#fbe9e7" opacity=".55"/>
<text class="smb" x="1244" y="172" text-anchor="end" fill="#8f1d17">beyond practical reach</text>
<g class="grid">
  <path d="M1062 368 H1416 M1062 283 H1416 M1062 198 H1416 M1062 152 H1416"/>
</g>
<path class="ax" d="M1062 470 H1416 M1062 152 V470"/>
<g class="sm" text-anchor="end">
  <text x="1054" y="474">10⁰</text>
  <text x="1054" y="389">10⁵</text>
  <text x="1054" y="304">10¹⁰</text>
  <text x="1054" y="219">10¹⁵</text>
  <text x="1054" y="157">10¹⁹</text>
</g>
<!-- 2^N line -->
<path d="M1072.7 459.8 L1405.3 142.5" fill="none" stroke="#b26a00" stroke-width="2.6"/>
<g fill="#b26a00">
  <circle cx="1072.7" cy="459.8" r="4"/><circle cx="1115.6" cy="418.8" r="4"/>
  <circle cx="1169.3" cy="367.6" r="4"/><circle cx="1233.6" cy="306.2" r="4"/><circle cx="1405.3" cy="142.5" r="4"/>
</g>
<text class="smb" x="1300" y="230" fill="#7a4600" transform="rotate(-43 1300 230)">2ᴺ-tree</text>
<!-- kd constant -->
<path d="M1062 464.9 H1416" fill="none" stroke="#2e7d32" stroke-width="2.6"/>
<text class="smb" x="1410" y="457" text-anchor="end" fill="#1e5b21">k-d tree: always 2</text>
<!-- x ticks -->
<g class="sm" text-anchor="middle">
  <text x="1072.7" y="490">2</text><text x="1115.6" y="490">10</text><text x="1169.3" y="490">20</text>
  <text x="1233.6" y="490">32</text><text x="1405.3" y="490">64</text>
</g>
<text class="sm" x="1239" y="514" text-anchor="middle">ambient dimension N</text>
<text class="sm" x="1010" y="290" text-anchor="middle" transform="rotate(-90 1010 290)">children per split (log scale)</text>

<text class="pl" x="1008" y="546">Log scale: the fan-out is a straight line, the binary split a constant.</text>

<text class="cap" x="32" y="596">Figure 2 | The bottleneck at high N is the tree, not the theory. A 2ᴺ-tree allocates every orthant of every subdivided cell, so the branching</text>
<text class="cap" x="32" y="616">factor alone exhausts memory near N = 20. Cutting one axis at a time gives branching factor 2 in every dimension and reaches the same</text>
<text class="cap" x="32" y="636">resolution after N cuts, while allocating only the cells the search actually descends into. Because sdf_geq_everywhere depends on a cell's</text>
<text class="cap" x="32" y="656">centre and half-diagonal alone — never on how the cell was produced — the pruning proof carries over unchanged. Cycling the split axis by</text>
<text class="cap" x="32" y="676">descending coordinate weight makes the refinement dimension-adaptive, so cost follows the effective rather than the ambient dimension (§2.3).</text>
</svg>
