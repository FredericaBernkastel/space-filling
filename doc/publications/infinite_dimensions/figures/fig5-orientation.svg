<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 810" width="1480" height="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#16202b">
<title>What orientation is worth: the anisotropy bound on greedy insertion</title>
<defs>
  <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16202b"/>
  </marker>
  <marker id="a5s" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7a"/>
  </marker>
  <style>
    .ttl { font-size:19px; font-weight:700; letter-spacing:1.5px; }
    .sub { font-size:13.4px; fill:#5a6b7a; }
    .pn  { font-size:14.4px; font-weight:700; }
    .pl  { font-size:12.2px; fill:#3d4d5c; }
    .sm  { font-size:11.4px; fill:#5a6b7a; }
    .smb { font-size:11.4px; font-weight:700; }
    .cellt { font-size:13.4px; font-weight:700; }
    .area  { font-size:17px; font-weight:700; }
    .th, .th text { font-size:11.6px; font-weight:700; letter-spacing:.8px; fill:#ffffff; }
    .td  { font-size:12.2px; }
    .rl  { font-size:12.2px; font-weight:700; }
    .mt  { font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .mm  { font-family:Georgia,'Times New Roman',serif; font-size:15px; }
    .cap { font-family:Georgia,'Times New Roman',serif; font-size:13.2px; fill:#4b5b6a; }
  </style>
</defs>
<rect width="1480" height="810" fill="#ffffff"/>

<text class="ttl" x="32" y="36">ORIENTATION IS WORTH A FACTOR OF κᴺ, AND IT IS CURRENTLY LEFT ON THE TABLE</text>
<text class="sub" x="32" y="58">The greedy step matches a shape’s circumradius to the clearance, but a shape fits a region through its inradius. The gap is exactly the shape’s anisotropy, raised to the dimension</text>
<path d="M32 72 H1448" stroke="#16202b" stroke-width="1.6"/>

<!-- ================= panel (a): the counterexample ================= -->
<rect x="32" y="90" width="1416" height="348" rx="7" fill="#ffffff" stroke="#d5dee6"/>
<rect x="32" y="90" width="1416" height="34" rx="7" fill="#0d1721"/>
<rect x="32" y="112" width="1416" height="12" fill="#0d1721"/>
<text class="pn" x="48" y="113" fill="#ffffff">(a)  A free region of 2 × 1, and a shape of aspect 1 : 2 — three ways to place it</text>

<!-- cell 1: as built today -->
<rect x="100" y="160" width="400" height="200" fill="#f7fafc" stroke="#8a9aa8" stroke-width="1.4" stroke-dasharray="7 4"/>
<circle cx="300" cy="260" r="100" fill="#eef2f7" stroke="#8a9aa8" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="255.3" y="170.6" width="89.4" height="178.8" fill="#fdf3e3" stroke="#b26a00" stroke-width="2.2"/>
<path d="M300 196 V324" stroke="#b26a00" stroke-width="1.4" marker-start="url(#a5s)" marker-end="url(#a5s)" opacity=".8"/>
<text class="sm" x="404" y="256" text-anchor="middle" fill="#5a6b7a">free ball</text>
<text class="sm" x="404" y="270" text-anchor="middle" fill="#5a6b7a">r = d = 0.5</text>
<text class="cellt" x="300" y="388" text-anchor="middle">as built today</text>
<text class="sm" x="300" y="406" text-anchor="middle">scale = d / R_S — orientation never enters</text>
<text class="area" x="300" y="428" text-anchor="middle" fill="#b26a00">area 0.40</text>

<!-- cell 2: best without rotation -->
<rect x="540" y="160" width="400" height="200" fill="#f7fafc" stroke="#8a9aa8" stroke-width="1.4" stroke-dasharray="7 4"/>
<rect x="690" y="160" width="100" height="200" fill="#eef2f7" stroke="#2c5aa0" stroke-width="2.2"/>
<path d="M740 190 V330" stroke="#2c5aa0" stroke-width="1.4" marker-start="url(#a5s)" marker-end="url(#a5s)" opacity=".8"/>
<text class="cellt" x="740" y="388" text-anchor="middle">best without rotation</text>
<text class="sm" x="740" y="406" text-anchor="middle">largest 1 : 2 copy that fits axis-aligned</text>
<text class="area" x="740" y="428" text-anchor="middle" fill="#2c5aa0">area 0.50</text>

<!-- cell 3: rotated -->
<rect x="980" y="160" width="400" height="200" fill="#f7fafc" stroke="#8a9aa8" stroke-width="1.4" stroke-dasharray="7 4"/>
<rect x="980" y="160" width="400" height="200" fill="#e3f2e4" stroke="#2e7d32" stroke-width="2.6"/>
<path d="M1050 260 H1310" stroke="#2e7d32" stroke-width="1.4" marker-start="url(#a5s)" marker-end="url(#a5s)" opacity=".8"/>
<text class="smb" x="1180" y="245" text-anchor="middle" fill="#1e5b21">fills the region exactly</text>
<text class="cellt" x="1180" y="388" text-anchor="middle">rotated by π / 2</text>
<text class="sm" x="1180" y="406" text-anchor="middle">inradius, not circumradius, meets the wall</text>
<text class="area" x="1180" y="428" text-anchor="middle" fill="#2e7d32">area 2.00  —  5 × today</text>

<!-- ================= panel (b): the bound ================= -->
<rect x="32" y="458" width="668" height="242" rx="7" fill="#ffffff" stroke="#d5dee6"/>
<rect x="32" y="458" width="668" height="34" rx="7" fill="#2c5aa0"/>
<rect x="32" y="480" width="668" height="12" fill="#2c5aa0"/>
<text class="pn" x="48" y="481" fill="#ffffff">(b)  Why κᴺ, and why it cannot be beaten</text>

<circle cx="176" cy="596" r="89.4" fill="none" stroke="#8a9aa8" stroke-width="1.3" stroke-dasharray="4 3"/>
<rect x="136" y="516" width="80" height="160" fill="#eef2f7" stroke="#2c5aa0" stroke-width="2"/>
<circle cx="176" cy="596" r="40" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M176 596 H216" stroke="#b3261e" stroke-width="1.5" marker-end="url(#a5)"/>
<text class="smb" x="190" y="588" fill="#b3261e">r_S</text>
<path d="M176 596 L239 533" stroke="#5a6b7a" stroke-width="1.5" marker-end="url(#a5)"/>
<text class="smb" x="238" y="556" fill="#3d4d5c">R_S</text>

<text class="mm" x="290" y="536">(d / R_S)ᴺ · vol(S)  ≤  vol_best  ≤  (d / r_S)ᴺ · vol(S)</text>
<text class="sm" x="352" y="554">↑ the crate today</text>
<text class="sm" x="600" y="554" text-anchor="middle">↑ unimprovable</text>
<text class="pl" x="290" y="588">Any admissible copy contains its own inradius ball, so</text>
<text class="pl" x="290" y="606">s · r_S ≤ max g = d. The two bounds differ by</text>
<text class="mm" x="290" y="638">κᴺ,    κ = R_S / r_S</text>
<text class="pl" x="290" y="666">and the bound is attained — panel (a) is the equality case.</text>
<text class="pl" x="290" y="684">For a ball κ = 1: today’s placement is already optimal.</text>

<!-- ================= panel (c): the table ================= -->
<rect x="720" y="458" width="728" height="242" rx="7" fill="#ffffff" stroke="#d5dee6"/>
<rect x="720" y="458" width="728" height="34" rx="7" fill="#b26a00"/>
<rect x="720" y="480" width="728" height="12" fill="#b26a00"/>
<text class="pn" x="736" y="481" fill="#ffffff">(c)  How much every shape leaves unclaimed</text>

<rect x="736" y="504" width="696" height="26" fill="#0d1721"/>
<g class="th">
  <text x="748" y="521">SHAPE</text>
  <text x="1058" y="521">N</text>
  <text x="1116" y="521">κ</text>
  <text x="1196" y="521">κᴺ  ( VOLUME LEFT ON THE TABLE )</text>
</g>
<g>
  <rect x="736" y="530" width="696" height="24" fill="#ffffff"/>
  <rect x="736" y="554" width="696" height="24" fill="#f6f9fb"/>
  <rect x="736" y="578" width="696" height="24" fill="#ffffff"/>
  <rect x="736" y="602" width="696" height="24" fill="#f6f9fb"/>
  <rect x="736" y="626" width="696" height="24" fill="#ffffff"/>
  <rect x="736" y="650" width="696" height="24" fill="#f6f9fb"/>
  <path d="M736 554 H1432 M736 578 H1432 M736 602 H1432 M736 626 H1432 M736 650 H1432"
        stroke="#dde5ec" stroke-width="1"/>
  <rect x="736" y="530" width="696" height="144" fill="none" stroke="#c3cfd9" stroke-width="1.1"/>
</g>
<g class="td">
  <text class="rl" x="748" y="547">ball</text>          <text x="1058" y="547">any</text> <text x="1116" y="547">1.000</text> <text class="rl" x="1196" y="547">1.00</text>
  <text class="rl" x="748" y="571">square</text>        <text x="1058" y="571">2</text>   <text x="1116" y="571">1.414</text> <text class="rl" x="1196" y="571">2.00</text>
  <text class="rl" x="748" y="595">equilateral triangle</text> <text x="1058" y="595">2</text> <text x="1116" y="595">2.000</text> <text class="rl" x="1196" y="595">4.00</text>
  <text class="rl" x="748" y="619">rectangle 1 : 2</text> <text x="1058" y="619">2</text> <text x="1116" y="619">2.236</text> <text class="rl" x="1196" y="619">5.00</text>
  <text class="rl" x="748" y="643">cube</text>          <text x="1058" y="643">3</text>   <text x="1116" y="643">1.732</text> <text class="rl" x="1196" y="643">5.20</text>
  <text class="rl" x="748" y="667">regular tetrahedron</text> <text x="1058" y="667">3</text> <text x="1116" y="667">3.000</text> <text class="rl" x="1196" y="667">27.00</text>
</g>
<g>
  <rect x="1256" y="537" width="10" height="10" fill="#e6eaee"/>
  <rect x="1256" y="561" width="20" height="10" fill="#f0d6ae"/>
  <rect x="1256" y="585" width="40" height="10" fill="#e8bd7e"/>
  <rect x="1256" y="609" width="50" height="10" fill="#e0a44e"/>
  <rect x="1256" y="633" width="52" height="10" fill="#e0a44e"/>
  <rect x="1256" y="657" width="120" height="10" fill="#b26a00"/>
</g>
<text class="smb" x="736" y="692" fill="#8a5200">Even the N-cube — the least anisotropic box there is — has κ = √N, so the gap is N ᴺ/², or 16 × in ℝ⁴ and 10⁵ × in ℝ¹⁰.</text>

<text class="cap" x="32" y="732">Figure 5 | The greedy step scales a unit shape so its circumradius meets the clearance, which is sound but orientation-blind. (a) A 2 × 1 free</text>
<text class="cap" x="32" y="752">region and a shape of aspect 1 : 2. The present rule yields area 0.40; the best axis-aligned copy 0.50; the copy rotated by a right angle fills the</text>
<text class="cap" x="32" y="772">region exactly, at area 2.00. The ratio 5.00 is precisely κ², and 0.40 is also the <tspan font-style="italic">worst</tspan> orientation’s area, so today’s placement coincides</text>
<text class="cap" x="32" y="792">with the least favourable pose. (b) The bound and its proof. (c) The shortfall for common shapes, and its growth with dimension.</text>
</svg>
