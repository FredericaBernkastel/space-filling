# Doc-asset generator for doc/shapes/*.avif. Not part of either library — it
# exists so the images in the API docs are generated from the actual fields
# rather than drawn by hand. Three stages:
#
#   1. cd doc/shape_gallery && cargo run --release
#        Evaluates every field. Planar shapes become rasters of field values in
#        doc/shapes/_raw; the rest are dual-contoured into OBJ meshes in
#        doc/shapes/_mesh (see src/mesh.rs).
#   2. blender -b --python doc/shape_gallery/render.py --
#        Renders the meshes, one 10-bit HDR AVIF per frame, into
#        doc/shapes/_frames. See readme.md for the exact invocation.
#   3. cd doc/video && uv run python ../shape_gallery/encode.py
#        Colours the rasters, muxes the frame sequences, writes the AVIFs.
#
# Stage 2 needs an official blender.org build; it resolves its own paths, so it can
# be run from anywhere. The three underscore-prefixed directories are intermediates — together a
# few GiB — and can be deleted once stage 3 has consumed them.
[package]
name = "shape-gallery"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "shape-gallery"
path = "src/main.rs"

[dependencies]
space-filling = { path = "../.." }
adaptive-distance-field = { path = "../../adaptive-distance-field" }
nalgebra = "0.35"
rayon = "1.12"
anyhow = "1.0"

# own workspace root, so cargo does not attach this to the parent
[workspace]
