# The adaptive distance field on its own: the SDF algebra it is defined over,
# the flat-arena 2^N-tree that stores it, and the ascent that searches it.
# Knows nothing about space filling — that layer (the `space-filling` crate)
# adds the shape catalogue, the discrete Argmax2D solver and drawing.
[package]
name = "adaptive-distance-field"
version = "0.1.0"
description = "Adaptively sampled distance fields in N dimensions, with Lipschitz-certified pruning"
authors = ["Frederica Bernkastel <bernkastel.frederica@protonmail.com>"]
repository = "https://github.com/FredericaBernkastel/space-filling"
documentation = "https://docs.rs/adaptive-distance-field/"
categories = ["science", "data-structures"]
keywords = ["sdf", "distance-field", "quadtree", "octree"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "adaptive_distance_field"
path = "src/lib.rs"

[dependencies]
nalgebra = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }
humansize = "1.1"

[dev-dependencies]
rand = { workspace = true }
rand_pcg = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
